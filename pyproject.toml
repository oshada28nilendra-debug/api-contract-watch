[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "api-contract-watch"
version = "0.1.0"
description = "Conservative OpenAPI contract regression checks for CI"
requires-python = ">=3.10"
readme = "README.md"
dependencies = []

[project.scripts]
api-contract-watch = "api_contract_watch.__main__:main"

[tool.setuptools.packages.find]
include = ["api_contract_watch*"]
