name: Contract Watch CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and CLI integration tests
        run: python -m unittest discover -s tests -v
      - name: Compatible contract gate
        run: python -m api_contract_watch examples/baseline.json examples/compatible.json
      - name: Verify breaking and review exit codes
        shell: bash
        run: |
          set +e
          python -m api_contract_watch examples/baseline.json examples/breaking.json --format json
          breaking=$?
          python -m api_contract_watch examples/baseline.json examples/review.json --format json
          review=$?
          test "$breaking" -eq 1 && test "$review" -eq 2
